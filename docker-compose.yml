version: "3.9"
services:
  nids:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-nids
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - INTERFACE=eth0
    command: ["--iface", "eth0"]
    volumes:
      - ./logs:/var/log/nids
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: nids-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./dashboard/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: nids-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./dashboard/grafana/provisioning:/etc/grafana/provisioning
      - ./dashboard/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
